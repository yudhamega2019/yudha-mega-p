<!DOCTYPE html>
<!--
  LANGKAH 1: HTML = KERANGKA / STRUKTUR aplikasi.
  HTML menentukan "apa saja yang ada di layar": judul, kotak input, tombol, daftar.
-->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Supaya tampilan pas di layar HP -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Tugas Saya</title>
  <!-- Bagian tampilan (CSS) -->
  <style>
/*
  LANGKAH 2: CSS = TAMPILAN / DESAIN aplikasi.
  Cara bacanya:  selektor { properti: nilai; }
*/
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px;
}

/* ".kartu" artinya: elemen yang punya class="kartu" */
.kartu {
  width: 100%;
  max-width: 480px;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

h1 { margin-top: 0; font-size: 1.5rem; }

/* "#form-tugas" artinya: elemen yang punya id="form-tugas" */
#form-tugas { display: flex; gap: 8px; }

#input-tugas {
  flex: 1;
  padding: 10px 12px;
  font-size: 1rem;
  border: 1px solid #ccd3dd;
  border-radius: 8px;
}

button {
  padding: 10px 16px;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  background: #2f6fed;
  color: white;
  cursor: pointer;
}
button:hover { background: #1f56c4; }

#daftar-tugas { list-style: none; padding: 0; margin: 20px 0 0; }

.tugas {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #eef0f3;
}
.tugas span { flex: 1; cursor: pointer; }

/* Tugas yang sudah selesai: dicoret dan dibuat pudar */
.tugas.selesai span { text-decoration: line-through; color: #9aa3af; }

.tombol-hapus { background: transparent; color: #d33; padding: 4px 8px; }
.tombol-hapus:hover { background: #fdecec; }

.info { color: #6b7280; font-size: 0.9rem; margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="kartu">
    <h1>📝 Daftar Tugas Saya</h1>

    <!-- Form untuk menambah tugas baru -->
    <form id="form-tugas">
      <input id="input-tugas" type="text"
        placeholder="Mau mengerjakan apa hari ini?"
        autocomplete="off" required>
      <button type="submit">Tambah</button>
    </form>

    <!-- Tempat daftar tugas ditampilkan (diisi oleh JavaScript) -->
    <ul id="daftar-tugas"></ul>
    <p id="info" class="info"></p>
  </main>

  <!-- Bagian logika (JavaScript) -->
  <script>
/*
  LANGKAH 3: JavaScript = OTAK / LOGIKA aplikasi.
*/

// --- 1. Ambil elemen HTML yang akan kita pakai ---
const form = document.getElementById('form-tugas');
const input = document.getElementById('input-tugas');
const daftar = document.getElementById('daftar-tugas');
const info = document.getElementById('info');

// --- 2. DATA: semua tugas disimpan di sebuah array ---
// Setiap tugas adalah objek: { id, teks, selesai }
let tugasTugas = muatData();

function muatData() {
  try {
    const dataTersimpan = localStorage.getItem('tugas');
    return dataTersimpan ? JSON.parse(dataTersimpan) : [];
  } catch {
    return [];
  }
}

function simpanData() {
  try {
    localStorage.setItem('tugas', JSON.stringify(tugasTugas));
  } catch {}
}

// --- 3. TAMPILKAN: ubah data menjadi elemen HTML di layar ---
function tampilkan() {
  daftar.innerHTML = '';

  for (const tugas of tugasTugas) {
    const li = document.createElement('li');
    li.className = tugas.selesai ? 'tugas selesai' : 'tugas';

    const centang = document.createElement('input');
    centang.type = 'checkbox';
    centang.checked = tugas.selesai;
    centang.addEventListener('change', () => ubahStatus(tugas.id));

    const teks = document.createElement('span');
    teks.textContent = tugas.teks;
    teks.addEventListener('click', () => ubahStatus(tugas.id));

    const hapus = document.createElement('button');
    hapus.className = 'tombol-hapus';
    hapus.textContent = '✕';
    hapus.addEventListener('click', () => hapusTugas(tugas.id));

    li.append(centang, teks, hapus);
    daftar.append(li);
  }

  const sisa = tugasTugas.filter((t) => !t.selesai).length;
  info.textContent = tugasTugas.length === 0
    ? 'Belum ada tugas. Yuk tambahkan satu!'
    : `${sisa} dari ${tugasTugas.length} tugas belum selesai.`;
}

// --- 4. AKSI: fungsi-fungsi yang mengubah data ---
function tambahTugas(teks) {
  tugasTugas.push({ id: Date.now(), teks: teks, selesai: false });
  simpanData();
  tampilkan();
}

function ubahStatus(id) {
  const tugas = tugasTugas.find((t) => t.id === id);
  tugas.selesai = !tugas.selesai;
  simpanData();
  tampilkan();
}

function hapusTugas(id) {
  tugasTugas = tugasTugas.filter((t) => t.id !== id);
  simpanData();
  tampilkan();
}

// --- 5. EVENT: saat tombol "Tambah" ditekan ---
form.addEventListener('submit', (event) => {
  event.preventDefault();
  const teks = input.value.trim();
  if (teks === '') return;
  tambahTugas(teks);
  input.value = '';
  input.focus();
});

tampilkan();
  </script>
</body>
</html>
